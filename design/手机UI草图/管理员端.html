  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(

    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    }

function solve(){if(state.solve===&#x27;failure&#x27;)return diagnosis();if(state.solve===&#x27;running&#x27;)return heading(&#x27;正在排程&#x27;,&#x27;可以取消；已有草稿会保留。&#x27;)+&#x27;&lt;section class=&quot;st-panel&quot;&gt;&lt;span class=&quot;st-badge&quot;&gt;求解中&lt;/span&gt;&lt;h2 style=&quot;margin-top:15px&quot;&gt;&#x27;+[&#x27;准备就绪曲目与候选时段&#x27;,&#x27;层级 L0：优先减少缺席&#x27;,&#x27;层级 L1：优化往返与空档&#x27;][state.phase]+&#x27;&lt;/h2&gt;&lt;div class=&quot;st-progress&quot; role=&quot;progressbar&quot; aria-label=&quot;模拟求解进度&quot; aria-valuenow=&quot;&#x27;+(20+state.phase*35)+&#x27;&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot;&gt;&lt;span style=&quot;width:&#x27;+(20+state.phase*35)+&#x27;%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&#x27;+btn(&#x27;取消求解&#x27;,&#x27;data-action=&quot;cancel&quot;&#x27;)+&#x27;&lt;/section&gt;&#x27;;return heading(&#x27;排程&#x27;,&#x27;先检查，再开始求解。&#x27;)+&#x27;&lt;section class=&quot;st-panel&quot;&gt;&lt;div class=&quot;st-section&quot;&gt;&lt;h2&gt;求解前检查&lt;/h2&gt;&#x27;+badge(pending().length?&#x27;2 项需注意&#x27;:&#x27;1 项需注意&#x27;,&#x27;orange&#x27;)+&#x27;&lt;/div&gt;&#x27;+[[true,&#x27;每首曲目都有参演人员&#x27;],[true,&#x27;曲目排练次数与时长已设置&#x27;],[true,&#x27;3 条特殊要求已启用&#x27;],[pending().length===0,pending().length?pending().length+&#x27; 位成员尚未提交空闲时间&#x27;:&#x27;全员已提交空闲时间&#x27;],[false,&#x27;评估日共同空闲不足：差思、幸 2 人&#x27;]].map(([ok,t])=&gt;&#x27;&lt;div class=&quot;st-checkrow&quot;&gt;&lt;span class=&quot;st-checkmark &#x27;+(!ok?&#x27;warn&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+(ok?&#x27;✓&#x27;:&#x27;!&#x27;)+&#x27;&lt;/span&gt;&lt;span&gt;&#x27;+t+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;div class=&quot;st-note warning&quot;&gt;可以先排已就绪的曲目；未满足的要求会显示在结果诊断中。&lt;/div&gt;&lt;div class=&quot;st-actions&quot;&gt;&#x27;+btn(&#x27;回填报进度&#x27;,&#x27;data-page=&quot;progress&quot;&#x27;)+btn(&#x27;开始求解&#x27;,&#x27;data-modal=&quot;precheck&quot;&#x27;,true)+&#x27;&lt;/div&gt;&lt;/section&gt;&#x27;;}
function calendarGrid(){let out=&#x27;&lt;div class=&quot;st-daystrip&quot; aria-label=&quot;本周日期&quot;&gt;&#x27;+[&#x27;一&#x27;,&#x27;二&#x27;,&#x27;三&#x27;,&#x27;四&#x27;,&#x27;五&#x27;,&#x27;六&#x27;,&#x27;日&#x27;].map((d,i)=&gt;&#x27;&lt;button type=&quot;button&quot; data-calday=&quot;&#x27;+i+&#x27;&quot; aria-pressed=&quot;&#x27;+(calendarDay===i)+&#x27;&quot;&gt;&lt;span&gt;&#x27;+d+&#x27;&lt;/span&gt;&lt;strong&gt;&#x27;+(14+i)+&#x27;&lt;/strong&gt;&lt;/button&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;st-daycalendar&quot; aria-label=&quot;9月&#x27;+(14+calendarDay)+&#x27;日排练时间轴&quot;&gt;&#x27;;for(let h=10;h&lt;23;h++){out+=&#x27;&lt;div class=&quot;st-time&quot; style=&quot;grid-column:1;grid-row:&#x27;+(h-9)+&#x27;&quot;&gt;&#x27;+h+&#x27;:00&lt;/div&gt;&lt;div class=&quot;st-cell&quot; data-drop-day=&quot;&#x27;+calendarDay+&#x27;&quot; data-drop-hour=&quot;&#x27;+h+&#x27;&quot; style=&quot;grid-column:2;grid-row:&#x27;+(h-9)+&#x27;&quot;&gt;&lt;/div&gt;&#x27;;}

7;&#x27;)+(state.comparison?&#x27;&lt;div class=&quot;st-diff&quot;&gt;&lt;div&gt;&lt;span&gt;移动&lt;/span&gt; c · 玩火：9/14 13:00 → 9/15 14:00 · 影响衿、菁、Siri、嘎&lt;/div&gt;&lt;div&gt;&lt;span&gt;移动&lt;/span&gt; a · lemonadeB：9/15 18:00 → 9/17 18:00 · 影响菁、若、思、衿&lt;/div&gt;&lt;div&gt;新增 0 场 · 删除 0 场 · 评估场已锁定&lt;/div&gt;&lt;/div&gt;&#x27;:&#x27;&#x27;)+(state.view===&#x27;week&#x27;?calendarGrid():state.view===&#x27;list&#x27;?table([&#x27;日期&#x27;,&#x27;时间&#x27;,&#x27;曲目&#x27;,&#x27;状态&#x27;],events.map(e=&gt;[&#x27;9/&#x27;+(14+e.day),e.hour+&#x27;:00–&#x27;+(e.hour+e.len)+&#x27;:00&#x27;,btn(e.code+&#x27; · &#x27;+esc(e.name),&#x27;data-event=&quot;&#x27;+e.id+&#x27;&quot;&#x27;,false,true),state.locks.includes(e.id)?&#x27;已锁定&#x27;:&#x27;可调整&#x27;])):table([&#x27;成员&#x27;,&#x27;本周排练&#x27;,&#x27;总时长&#x27;],[[&#x27;衿&#x27;,&#x27;c · 玩火、a · lemonadeB、评估&#x27;,&#x27;8h&#x27;],[&#x27;菁&#x27;,&#x27;c · 玩火、a · lemonadeB、评估&#x27;,&#x27;8h&#x27;],[&#x27;Siri&#x27;,&#x27;c · 玩火、b · After LIKE、评估&#x27;,&#x27;7h&#x27;]]))+eventDetail()+&#x27;&lt;details&gt;&lt;summary&gt;成员统计 · 时长、天数、往返与空档&lt;/summary&gt;&#x27;+table([&#x27;成员&#x27;,&#x27;总时长&#x27;,&#x27;天数 / 往返&#x27;,&#x27;空档&#x27;],[[&#x27;衿&#x27;,&#x27;8 小时&#x27;,&#x27;3 / 3&#x27;,&#x27;1 小时&#x27;],[&#x27;菁&#x27;,&#x27;8 小时&#x27;,&#x27;3 / 3&#x27;,&#x27;1 小时&#x27;],[&#x27;Siri&#x27;,&#x27;7 小时&#x27;,&#x27;3 / 3&#x27;,&#x27;0 小时&#x27;]])+&#x27;&lt;/details&gt;&lt;/section&gt;&#x27;;}
