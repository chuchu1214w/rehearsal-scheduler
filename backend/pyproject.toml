[build-system]
requires = ["setuptools>=68"]
backend-path = []
build-backend = "setuptools.build_meta"

[project]
name = "rehearsal-scheduler"
version = "0.2.0"
description = "舞团排练排程系统:FastAPI 后端 + OR-Tools CP-SAT 求解包"
requires-python = ">=3.12"
dependencies = [
    "ortools>=9.15,<9.16",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "argon2-cffi>=23.1",
    "pywebpush>=2.0",
    "httpx[http2]>=0.28",
    "cryptography>=42",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "markdown>=3.5",  # scripts/md2pdf.py(文档转 PDF)
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "solver*"]

[tool.setuptools.package-data]
solver = ["fixtures/*.json"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
