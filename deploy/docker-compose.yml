# 自己的云主机(部署指南.md 方案 B):应用 + Caddy 自动 HTTPS。
# 用法:在仓库根目录  cp .env.example .env(填 PUBLIC_BASE_URL 等),然后
#   DOMAIN=你的域名 docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      COOKIE_SECURE: "true"
    volumes:
      - ./data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?请设置 DOMAIN=你的域名}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
