}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;

  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**

   * @param {string} property

  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {

    }

   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      modelContent: null,
      privateContent: null,
      ...parsedState,

    if (encode(serializedState).length &gt; 16 * 1024) {

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },

    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {

                }

          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();

    { capture: true },
  );

  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }

    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

    return `&lt;main class=&quot;rm-content&quot;&gt;&lt;div class=&quot;rm-kicker&quot;&gt;你好，衿&lt;/div&gt;&lt;h2&gt;我的首页&lt;/h2&gt;&lt;p class=&quot;rm-lead&quot;&gt;今天，只要处理这一件事。&lt;/p&gt;${notification()}&lt;article class=&quot;rm-card&quot;&gt;&lt;div class=&quot;rm-card-top&quot;&gt;&lt;span class=&quot;rm-small&quot;&gt;秋日舞台公演&lt;/span&gt;&lt;span class=&quot;rm-tag ${state.hasChanges||state.awaitingConfirmation?&#x27;rm-warm&#x27;:&#x27;&#x27;}&quot;&gt;${status}&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;${heading}&lt;/h3&gt;${inside}&lt;/article&gt;${published?&#x27;&lt;button type=&quot;button&quot; class=&quot;rm-link&quot; data-action=&quot;availability&quot;&gt;修改空闲时间&lt;/button&gt;&#x27;:&#x27;&#x27;}&lt;/main&gt;${main}${nav()}`;
  }
  function dates() {const start=Math.min(Math.max(state.day-2,0),11);return `&lt;div class=&quot;rm-dates&quot; aria-label=&quot;日期选择，可横向滑动&quot;&gt;&lt;button type=&quot;button&quot; data-action=&quot;day-prev&quot; aria-label=&quot;前一天&quot; ${state.day===0?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;‹&lt;/button&gt;${Array.from({length:5},(_,i)=&gt;{const d=start+i;return `&lt;button type=&quot;button&quot; data-day=&quot;${d}&quot; aria-pressed=&quot;${d===state.day}&quot;&gt;&lt;span&gt;${d===15?&#x27;评估&#x27;:`周${weekdays[d%7]}`}&lt;/span&gt;&lt;strong&gt;9/${d+4}&lt;/strong&gt;&lt;span&gt;${state.filled.includes(d)?&#x27;已填&#x27;:&#x27;·&#x27;}&lt;/span&gt;&lt;/button&gt;`;}).join(&#x27;&#x27;)}&lt;button type=&quot;button&quot; data-action=&quot;day-next&quot; aria-label=&quot;后一天&quot; ${state.day===15?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;›&lt;/button&gt;&lt;/div&gt;`;}
  function availability() {
    const editing=state.status!==&#x27;pending&#x27;;
    return `&lt;main class=&quot;rm-content&quot;&gt;${back()}&lt;div class=&quot;rm-heading-row&quot;&gt;&lt;h2&gt;填空闲时间&lt;/h2&gt;&lt;span class=&quot;rm-count&quot; id=&quot;rm-filled&quot;&gt;已填 ${state.filled.length} / 16 天&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;rm-lead&quot;&gt;选一种画笔，点一下或按住滑过时段。&lt;/p&gt;${editing?&#x27;&lt;div class=&quot;rm-notice&quot;&gt;修改后需重新提交，排练表可能受影响。&lt;/div&gt;&#x27;:&#x27;&#x27;}${dates()}${state.day===15?&#x27;&lt;div class=&quot;rm-notice&quot;&gt;9/19 是全员评估日，只需 2–3 小时。请尽量留出连续时段。&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;div class=&quot;rm-brushes&quot; aria-label=&quot;空闲状态画笔&quot;&gt;${Object.entries(names).map(([v,n])=&gt;`&lt;button type=&quot;button&quot; data-brush=&quot;${v}&quot; aria-pressed=&quot;${state.brush===v}&quot;&gt;&lt;span class=&quot;rm-dot ${v}&quot;&gt;&lt;/span&gt;${n}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;rm-quick&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;rm-link&quot; data-action=&quot;copy-day&quot; ${state.day===0?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;复制上一天&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;rm-link&quot; data-action=&quot;all-free&quot;&gt;全天可排&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;rm-link&quot; data-action=&quot;all-busy&quot;&gt;全天不可排&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;rm-hours&quot; aria-label=&quot;当天 13 个小时的空闲状态&quot;&gt;${state.days[state.day].map((v,i)=&gt;`&lt;div class=&quot;rm-hour&quot;&gt;&lt;span class=&quot;rm-time&quot;&gt;${i+10}:00–${i+11}:00&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;rm-slot&quot; data-slot=&quot;${i}&quot; data-value=&quot;${v}&quot; aria-label=&quot;9 月 ${state.day+4} 日 ${i+10}:00 至 ${i+11}:00，${names[v]}&quot;&gt;${names[v]}&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${error?`&lt;p class=&quot;rm-error&quot; role=&quot;alert&quot;&gt;${error}&lt;/p&gt;`:&#x27;&#x27;}&lt;/main&gt;${footer(editing?&#x27;重新提交&#x27;:&#x27;提交空闲时间&#x27;,&#x27;submit&#x27;,`${16-state.filled.length} 天未填写，将按「${names[state.defaultMode]}」提交。`)}${nav()}`;
  }
  function schedule() {
    if(state.publishedVersion===0) return `&lt;main class=&quot;rm-content&quot;&gt;${back()}&lt;h2&gt;我的排练表&lt;/h2&gt;&lt;p class=&quot;rm-lead&quot;&gt;秋日舞台公演&lt;/p&gt;&lt;article class=&quot;rm-card&quot;&gt;&lt;span class=&quot;rm-tag&quot;&gt;尚未发布&lt;/span&gt;&lt;h3 style=&quot;margin-top:18px&quot;&gt;排练表正在准备中&lt;/h3&gt;&lt;p class=&quot;rm-card-copy&quot;&gt;${state.status===&#x27;pending&#x27;?&#x27;先填好你的空闲时间，管理员才能安排排练。&#x27;:&#x27;你的空闲时间已提交，管理员发布后会在这里显示。&#x27;}&lt;/p&gt;&lt;/article&gt;&lt;/main&gt;${footer(state.status===&#x27;pending&#x27;?&#x27;去填写&#x27;:&#x27;返回首页&#x27;,state.status===&#x27;pending&#x27;?&#x27;availability&#x27;:&#x27;home&#x27;)}${nav()}`;
    let last=&#x27;&#x27;;const list=sessions.map(s=&gt;{let title=s.date!==last?`&lt;div class=&quot;rm-date-title&quot;&gt;&lt;span&gt;${s.date} · ${s.day}&lt;/span&gt;&lt;span&gt;${sessions.filter(x=&gt;x.date===s.date).length} 场&lt;/span&gt;&lt;/div&gt;`:&#x27;&#x27;;last=s.date;return title+oneSession(s);}).join(&#x27;&#x27;);
    return `&lt;main class=&quot;rm-content&quot;&gt;${back()}&lt;div class=&quot;rm-heading-row&quot;&gt;&lt;h2&gt;我的排练表&lt;/h2&gt;&lt;span class=&quot;rm-tag&quot;&gt;已发布 v${state.publishedVersion}&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;rm-lead&quot;&gt;秋日舞台公演 · 8 场 · 以这里的时间为准&lt;/p&gt;${state.awaitingConfirmation?&#x27;&lt;div class=&quot;rm-notice&quot;&gt;空闲已更新，等待管理员确认。当前排练表可能受影响，确认后将发布新版本。&lt;/div&gt;&#x27;:&#x27;&#x27;}${state.hasChanges?&#x27;&lt;div class=&quot;rm-notice&quot;&gt;有 2 场变动，已在列表中高亮标出。&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;section class=&quot;rm-evaluation&quot;&gt;&lt;strong&gt;全员评估 · 9/19 周六&lt;/strong&gt;&lt;p&gt;你的到场时段：14:00–17:00&lt;/p&gt;&lt;p class=&quot;rm-small&quot;&gt;请提前到场，准备完整走台。&lt;/p&gt;&lt;/section&gt;${list}&lt;button type=&quot;button&quot; class=&quot;rm-link&quot; data-action=&quot;availability&quot;&gt;临时有变？修改空闲时间&lt;/button&gt;&lt;/main&gt;${footer(&#x27;添加到手机日历&#x27;,&#x27;subscribe&#x27;,&#x27;订阅后，新发布的排练安排会同步到日历。&#x27;)}${nav()}`;
  }
  function auth(invite) {return `&lt;main class=&quot;rm-content&quot;&gt;${invite?&#x27;&lt;div class=&quot;rm-kicker&quot;&gt;秋日舞台公演 · 成员邀请&lt;/div&gt;&#x27;:&#x27;&lt;div class=&quot;rm-kicker&quot;&gt;Season · 舞团排练排程&lt;/div&gt;&#x27;}&lt;h2&gt;${invite?&#x27;你好，衿&#x27;:&#x27;欢迎回来&#x27;}&lt;/h2&gt;&lt;p class=&quot;rm-lead&quot;&gt;${invite?&#x27;为自己设置一个账号，就可以填写空闲了。&#x27;:&#x27;登录后，继续你的演出准备。&#x27;}&lt;/p&gt;&lt;form class=&quot;rm-form&quot; id=&quot;rm-auth-form&quot; autocomplete=&quot;off&quot;&gt;&lt;label for=&quot;rm-username&quot;&gt;用户名&lt;input id=&quot;rm-username&quot; name=&quot;username&quot; placeholder=&quot;${invite?&#x27;设置用户名&#x27;:&#x27;输入用户名&#x27;}&quot; autocapitalize=&quot;none&quot; autocomplete=&quot;off&quot;&gt;&lt;/label&gt;&lt;label for=&quot;rm-password&quot;&gt;密码&lt;input id=&quot;rm-password&quot; name=&quot;password&quot; type=&quot;password&quot; placeholder=&quot;${invite?&#x27;设置密码&#x27;:&#x27;输入密码&#x27;}&quot; autocomplete=&quot;off&quot;&gt;&lt;/label&gt;&lt;/form&gt;${error?`&lt;p class=&quot;rm-error&quot; role=&quot;alert&quot;&gt;${error}&lt;/p&gt;`:&#x27;&#x27;}&lt;p class=&quot;rm-meta&quot;&gt;${invite?&#x27;绑定成员：衿 · 由管理员发出邀请&#x27;:&#x27;忘记密码请找管理员重置。&lt;br&gt;连续 5 次密码错误，需等待 15 分钟再试。&#x27;}&lt;/p&gt;&lt;/main&gt;${footer(invite?&#x27;设置账号，开始填空闲&#x27;:&#x27;登录&#x27;,&#x27;auth&#x27;,invite?&#x27;演示中不会创建真实账号。&#x27;:&#x27;演示中填写任意用户名和密码即可进入。&#x27;)}`;}
  function account() {return `&lt;main class=&quot;rm-content&quot;&gt;${back()}&lt;h2&gt;账号&lt;/h2&gt;${notification()}&lt;div class=&quot;rm-profile&quot;&gt;&lt;div class=&quot;rm-avatar&quot;&gt;衿&lt;/div&gt;&lt;div&gt;&lt;h3&gt;衿&lt;/h3&gt;&lt;p class=&quot;rm-small&quot;&gt;成员账号 · 已开通&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;rm-setting&quot;&gt;&lt;span&gt;用户名&lt;/span&gt;&lt;span&gt;jin&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rm-setting&quot;&gt;&lt;span&gt;当前演出&lt;/span&gt;&lt;span&gt;秋日舞台公演&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;rm-meta&quot;&gt;需要更改密码？请联系管理员重置。&lt;/p&gt;&lt;/main&gt;${footer(&#x27;退出登录&#x27;,&#x27;logout&#x27;)}${nav()}`;}
  function subscribe() {return `&lt;main class=&quot;rm-content&quot;&gt;${back(&#x27;返回排练表&#x27;,&#x27;schedule&#x27;)}&lt;h2&gt;添加到手机日历&lt;/h2&gt;&lt;p class=&quot;rm-lead&quot;&gt;订阅一次，跟随管理员发布的版本更新。&lt;/p&gt;&lt;div class=&quot;rm-subscribe&quot;&gt;&lt;section&gt;&lt;h3&gt;iPhone&lt;/h3&gt;&lt;p&gt;在日历里添加「订阅日历」，粘贴管理员提供的订阅链接，再设置排练前提醒。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Android&lt;/h3&gt;&lt;p&gt;在支持订阅网址的日历应用里添加订阅；具体入口随日历应用而异。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;rm-notice rm-calm&quot;&gt;此草图仅展示订阅流程。正式发布后，这里提供你的专属订阅链接。&lt;/div&gt;${button(&#x27;复制订阅链接&#x27;,&#x27;copy-subscription&#x27;,false,&#x27;rm-full&#x27;)}&lt;p class=&quot;rm-small&quot; style=&quot;margin-top:10px&quot;&gt;示例尚未接入日历，暂不提供可用链接。&lt;/p&gt;${notification()}&lt;/main&gt;${footer(&#x27;完成&#x27;,&#x27;schedule&#x27;)}${nav()}`;}
  function render() {
    phone.style.borderRadius=`${state.radius}px`;
    viewSelect.value=state.view===&#x27;subscribe&#x27;?&#x27;schedule&#x27;:state.view;
    statusSelect.value=state.status;
    screen.innerHTML=state.view===&#x27;home&#x27;?home():state.view===&#x27;availability&#x27;?availability():state.view===&#x27;schedule&#x27;?schedule():state.view===&#x27;invite&#x27;?auth(true):state.view===&#x27;login&#x27;?auth(false):state.view===&#x27;account&#x27;?account():subscribe();
    const form=root.querySelector(&#x27;#rm-auth-form&#x27;);if(form)form.addEventListener(&#x27;submit&#x27;,e=&gt;{e.preventDefault();authenticate();});
  }
  function markDay(){if(!state.filled.includes(state.day))state.filled.push(state.day);}
  function paint(slot) {
    if(slot&lt;0||slot&gt;12||slot===lastSlot)return;
    lastSlot=slot;state.days[state.day][slot]=state.brush;markDay();error=&#x27;&#x27;;
    const cell=root.querySelector(`[data-slot=&quot;${slot}&quot;]`);
    if(cell){cell.dataset.value=state.brush;cell.textContent=names[state.brush];cell.setAttribute(&#x27;aria-label&#x27;,`9 月 ${state.day+4} 日 ${slot+10}:00 至 ${slot+11}:00，${names[state.brush]}`);}
    const count=root.querySelector(&#x27;#rm-filled&#x27;);if(count)count.textContent=`已填 ${state.filled.length} / 16 天`;
  }
  function authenticate(){const user=root.querySelector(&#x27;#rm-username&#x27;),password=root.querySelector(&#x27;#rm-password&#x27;);if(!user.value.trim()||!password.value){error=&#x27;请填写用户名和密码。&#x27;;const old=root.querySelector(&#x27;.rm-error&#x27;);if(old)old.textContent=error;else{const p=document.createElement(&#x27;p&#x27;);p.className=&#x27;rm-error&#x27;;p.setAttribute(&#x27;role&#x27;,&#x27;alert&#x27;);p.textContent=error;root.querySelector(&#x27;#rm-auth-form&#x27;).after(p);}return;}password.value=&#x27;&#x27;;state.view=state.view===&#x27;invite&#x27;?&#x27;availability&#x27;:&#x27;home&#x27;;error=&#x27;&#x27;;notice=&#x27;&#x27;;render();save();}
  function go(view){state.view=view;notice=&#x27;&#x27;;error=&#x27;&#x27;;render();save();}
  root.addEventListener(&#x27;click&#x27;,e=&gt;{
    const day=e.target.closest(&#x27;[data-day]&#x27;);if(day){state.day=Number(day.dataset.day);render();save();return;}
    const brush=e.target.closest(&#x27;[data-brush]&#x27;);if(brush){state.brush=brush.dataset.brush;render();save();return;}
    const slot=e.target.closest(&#x27;[data-slot]&#x27;);if(slot&amp;&amp;e.detail===0){lastSlot=-1;paint(Number(slot.dataset.slot));render();save();return;}
    const trigger=e.target.closest(&#x27;[data-action]&#x27;);if(!trigger||trigger.disabled)return;
    const action=trigger.dataset.action;
    if(allowedViews.includes(action)){go(action);return;}
    if(action===&#x27;day-prev&#x27;||action===&#x27;day-next&#x27;){state.day=Math.max(0,Math.min(15,state.day+(action===&#x27;day-prev&#x27;?-1:1)));}
    else if(action===&#x27;all-free&#x27;||action===&#x27;all-busy&#x27;){state.days[state.day]=Array(13).fill(action===&#x27;all-free&#x27;?&#x27;free&#x27;:&#x27;busy&#x27;);markDay();}
    else if(action===&#x27;copy-day&#x27;){if(state.day&gt;0){state.days[state.day]=[...state.days[state.day-1]];markDay();}}
    else if(action===&#x27;submit&#x27;){
      if(state.filled.length===0){error=&#x27;请先填写至少一天的空闲时间。&#x27;;render();return;}
      const changed=state.publishedVersion&gt;0;
      state.awaitingConfirmation=changed;state.status=&#x27;submitted&#x27;;state.view=&#x27;home&#x27;;
      notice=changed?&#x27;空闲时间已更新。当前排练表可能受影响，请等待管理员确认。&#x27;:&#x27;空闲时间已提交，等待管理员安排排练。&#x27;;
    } else if(action===&#x27;auth&#x27;){authenticate();return;}
    else if(action===&#x27;logout&#x27;){go(&#x27;login&#x27;);return;}
    else if(action===&#x27;copy-subscription&#x27;){notice=&#x27;草图尚无可复制的订阅地址。正式版会在此复制你的专属链接。&#x27;;}
    render();save();
  });
  root.addEventListener(&#x27;pointerdown&#x27;,e=&gt;{const slot=e.target.closest(&#x27;[data-slot]&#x27;);if(slot){drawing=true;lastSlot=-1;paint(Number(slot.dataset.slot));e.preventDefault();}const strip=e.target.closest(&#x27;.rm-dates&#x27;);if(strip)swipeStart={x:e.clientX,y:e.clientY};});
  root.addEventListener(&#x27;pointermove&#x27;,e=&gt;{if(!drawing)return;const at=document.elementFromPoint(e.clientX,e.clientY);const slot=at?.closest(&#x27;[data-slot]&#x27;);if(slot&amp;&amp;root.contains(slot))paint(Number(slot.dataset.slot));});
  window.addEventListener(&#x27;pointerup&#x27;,e=&gt;{if(drawing){drawing=false;lastSlot=-1;render();save();}if(swipeStart){const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;if(Math.abs(dx)&gt;35&amp;&amp;Math.abs(dx)&gt;Math.abs(dy)){state.day=Math.max(0,Math.min(15,state.day+(dx&lt;0?1:-1)));render();save();}swipeStart=null;}});
  window.addEventListener(&#x27;pointercancel&#x27;,()=&gt;{if(drawing){drawing=false;lastSlot=-1;render();save();}swipeStart=null;});
  viewSelect.addEventListener(&#x27;change&#x27;,()=&gt;go(viewSelect.value));
  statusSelect.addEventListener(&#x27;change&#x27;,()=&gt;{state.status=statusSelect.value;state.publishedVersion=state.status===&#x27;changed&#x27;?2:state.status===&#x27;published&#x27;?1:0;state.hasChanges=state.status===&#x27;changed&#x27;;state.awaitingConfirmation=false;notice=&#x27;&#x27;;error=&#x27;&#x27;;render();save();});
  render();
  if(globalThis.Tweak){
    let oldDefault=state.defaultMode;
    const tweak=new Tweak({container:phone,onChange:()=&gt;{if(oldDefault!==state.defaultMode){state.days=state.days.map((d,i)=&gt;state.filled.includes(i)?d:Array(13).fill(state.defaultMode));oldDefault=state.defaultMode;}render();}});
    tweak.addSelect(state,&#x27;defaultMode&#x27;,{label:&#x27;填报模式对比&#x27;,options:[{label:&#x27;全部不可排 · 当前方案&#x27;,value:&#x27;busy&#x27;},{label:&#x27;全部可排 · 对比方案&#x27;,value:&#x27;free&#x27;}]});
    tweak.addSlider(state,&#x27;radius&#x27;,{label:&#x27;手机界面圆角&#x27;,min:12,max:32,step:2,unit:&#x27;px&#x27;});
  }
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

&lt;script&gt;
(() =&gt; {

  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
